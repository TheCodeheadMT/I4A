[project]
name = "difa-coordinator"
version = "0.1.0"
description = "Distributed Inference For All: Phase 0 coordinator prototype"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["services/coordinator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/coordinator"]
