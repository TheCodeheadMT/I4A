[package]
name = "difa-agent"
version = "0.1.0"
edition = "2021"
description = "DIFA device agent: enrollment, capability probes, owner-policy enforcement, and heartbeats"
license = "UNLICENSED"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

[profile.release]
strip = true
